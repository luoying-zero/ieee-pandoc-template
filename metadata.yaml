abstract: |
  这里是中文摘要。本文展示如何使用 Pandoc、XeLaTeX 和 IEEEtran
  模板生成包含中文内容的论文。通过在 metadata.yaml 中设置中文字体，
  可以正确处理中文标题、作者、摘要、关键词以及正文内容。

keywords:
