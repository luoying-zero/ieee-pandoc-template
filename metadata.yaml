# 建议使用 xelatex
CJKmainfont: "Noto Serif CJK SC"

# 可选：中文字体选项
CJKoptions:
  - AutoFakeBold=true
  - AutoFakeSlant=true

# 英文字体，可选
# mainfont: "Times New Roman"

# 纸张大小
papersize: a4

# 字号
fontsize: 10pt

# 是否给章节编号
numbersections: true

# 超链接设置，可选
colorlinks: true
linkcolor: blue
